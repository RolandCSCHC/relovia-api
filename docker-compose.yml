services:
  postgres:
    image: postgres:18
    container_name: relovia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relovia
      POSTGRES_PASSWORD: relovia
      POSTGRES_DB: relovia
    ports:
      # Host 5432 is already used by Homebrew PostgreSQL 14.
      - "5433:5432"
    volumes:
      # PostgreSQL 18 keeps its data in /var/lib/postgresql/18/docker.
      - relovia_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relovia -d relovia"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  relovia_postgres_data:
